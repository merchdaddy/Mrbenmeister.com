<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Lounge Review — Gold Label Club</title>
  <link rel="stylesheet" href="/css/glc.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* ── HEADER ── */
    .lounge-header { margin-bottom:1.8rem; padding-bottom:1.4rem; border-bottom:1px solid var(--border); }
    .lounge-header h1 { margin-bottom:.25rem; font-size:clamp(1.4rem,3vw,2.2rem); }
    .lounge-header .location { font-size:1rem; color:var(--muted); font-style:italic; margin-bottom:.5rem; display:flex; align-items:center; gap:.4rem; }
    .lounge-header .meta-row { display:flex; flex-wrap:wrap; gap:.5rem 1.5rem; margin-top:.6rem; }
    .lounge-header .meta-item { font-size:.82rem; color:var(--muted); display:flex; align-items:center; gap:.35rem; }

    /* ── GALLERY ── */
    .media-gallery { margin-bottom:2rem; }
    .gallery-thumbs { display:flex; gap:.5rem; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .gallery-thumbs::-webkit-scrollbar { display:none; }
    .gallery-thumb { flex-shrink:0; width:140px; height:100px; border-radius:var(--radius); overflow:hidden; border:2px solid var(--border); cursor:pointer; position:relative; transition:border-color .2s; }
    .gallery-thumb:first-child { width:200px; }
    .gallery-thumb:hover { border-color:var(--gold-d); }
    .gallery-thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
    .gallery-thumb:hover img { transform:scale(1.05); }
    .gallery-thumb.video-thumb-wrap { background:var(--s3); }
    .gallery-thumb .play-icon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(7,6,5,.5); }
    .gallery-thumb .play-icon i { font-size:1.5rem; color:var(--gold); }
    .gallery-count { font-family:var(--fh); font-size:.52rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-top:.5rem; }

    /* ── LIGHTBOX ── */
    .lightbox { position:fixed; inset:0; z-index:1000; background:rgba(7,6,5,.96); display:none; align-items:center; justify-content:center; padding:1rem; }
    .lightbox.open { display:flex; }
    .lightbox-inner { position:relative; max-width:900px; width:100%; }
    .lightbox-media { width:100%; max-height:80vh; object-fit:contain; display:block; border-radius:var(--radius); }
    .lightbox video { width:100%; max-height:80vh; border-radius:var(--radius); background:#000; }
    .lightbox-close { position:absolute; top:-2.5rem; right:0; background:none; border:none; color:var(--muted); font-size:1.4rem; cursor:pointer; transition:color .2s; }
    .lightbox-close:hover { color:var(--cream); }
    .lightbox-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(7,6,5,.7); border:1px solid var(--border); color:var(--muted); width:40px; height:40px; border-radius:50%; font-size:1rem; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; }
    .lightbox-nav:hover { border-color:var(--gold-d); color:var(--gold); }
    .lightbox-prev { left:-52px; }
    .lightbox-next { right:-52px; }
    .lightbox-caption { text-align:center; margin-top:.8rem; font-family:var(--fh); font-size:.55rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
    .lightbox-dots { display:flex; justify-content:center; gap:.4rem; margin-top:.6rem; }
    .lightbox-dots .dot { width:6px; height:6px; border-radius:50%; background:var(--dim); cursor:pointer; transition:background .2s; }
    .lightbox-dots .dot.active { background:var(--gold); }

    /* ── MAIN LAYOUT ── */
    .lounge-layout { display:grid; grid-template-columns:1fr 300px; gap:2rem; align-items:start; }
    .score-big { font-family:var(--fh); font-size:3rem; color:var(--gold); line-height:1; }

    /* ── RATING BARS ── */
    .rating-bar-row { display:flex; align-items:center; gap:.8rem; margin-bottom:.5rem; }
    .rating-bar-label { font-size:.82rem; color:var(--muted); width:150px; flex-shrink:0; }
    .rating-bar-track { flex:1; height:4px; background:var(--s4); border-radius:2px; }
    .rating-bar-fill { height:100%; background:linear-gradient(to right,var(--gold-d),var(--gold)); border-radius:2px; }
    .rating-bar-val { font-family:var(--fh); font-size:.6rem; color:var(--gold); width:28px; text-align:right; }

    .review-text p { color:var(--ivory); line-height:1.9; margin-bottom:1rem; font-size:.98rem; }
    .review-text p:last-child { margin-bottom:0; }
    .feature-pill { display:inline-flex; align-items:center; gap:.4rem; font-family:var(--fh); font-size:.52rem; letter-spacing:.15em; text-transform:uppercase; padding:.4rem .8rem; border-radius:var(--radius); border:1px solid; }
    .feature-yes { background:rgba(45,106,79,.15); border-color:var(--green); color:#7ecca0; }
    .feature-no  { background:rgba(122,40,40,.1);  border-color:var(--red);   color:#e09090; }
    .best-chip { display:inline-block; font-family:var(--fh); font-size:.52rem; letter-spacing:.12em; text-transform:uppercase; background:var(--s3); color:var(--gold-d); border:1px solid var(--border); padding:.35rem .8rem; border-radius:var(--radius); margin:.2rem; }
    .contact-row { display:flex; align-items:center; gap:.7rem; padding:.7rem 0; border-bottom:1px solid var(--border); }
    .contact-row:last-child { border-bottom:none; }
    .pending-banner { background:var(--s3); border:1px solid var(--border); border-left:3px solid var(--gold-d); border-radius:var(--radius); padding:1.2rem 1.4rem; margin-bottom:1.5rem; }

    /* ── MEMBER REVIEWS ── */
    .rv-card { padding:1.3rem 0; border-bottom:1px solid var(--border); }
    .rv-card:last-child { border-bottom:none; }
    .rv-own-badge { font-family:var(--fh); font-size:.44rem; letter-spacing:.15em; text-transform:uppercase; background:rgba(201,168,76,.12); color:var(--gold-d); padding:.18rem .55rem; border-radius:3px; }
    .rv-cat-chips { display:flex; flex-wrap:wrap; gap:.25rem .5rem; margin-top:.5rem; }
    .rv-cat-chip { font-size:.76rem; color:var(--muted); }
    .rv-cat-chip strong { color:var(--gold); font-family:var(--fh); font-size:.65rem; }

    /* ── REVIEW FORM MODAL ── */
    .rv-modal-overlay { display:none; position:fixed; inset:0; z-index:2000; background:rgba(6,5,4,.97); overflow-y:auto; padding:2rem 1rem; }
    .rv-modal-overlay.open { display:block; }
    .rv-modal-box { max-width:560px; margin:0 auto; background:var(--s2); border:1px solid var(--border); border-top:2px solid var(--gold-d); border-radius:var(--radius); padding:2rem; }
    .star-input { display:flex; align-items:center; gap:.3rem; }
    .rv-star { font-size:1.15rem; cursor:pointer; transition:color .1s; }
    .si-val { font-family:var(--fh); font-size:.6rem; color:var(--gold); width:42px; margin-left:.3rem; }
    .si-na { background:none; border:none; color:var(--dim); font-size:.7rem; cursor:pointer; padding:.1rem .35rem; font-family:var(--fh); letter-spacing:.08em; }
    .si-na:hover { color:var(--muted); }

    @media(max-width:900px){
      .lounge-layout { grid-template-columns:1fr; }
      .lightbox-prev { left:.3rem; }
      .lightbox-next { right:.3rem; }
    }
    @media(max-width:600px){
      .gallery-thumb { width:110px; height:82px; }
      .gallery-thumb:first-child { width:155px; }
    }
  </style>
</head>
<body>
<div id="pubNav"></div>
<div class="pub-mobile-menu" id="pubMobileMenu"></div>
<main class="pub-page">
  <div class="pub-section">
    <div class="pub-section-inner" style="max-width:1100px" id="pageBody">
      <div style="text-align:center;padding:5rem;color:var(--muted)">Loading review…</div>
    </div>
  </div>
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="lightboxBgClick(event)">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
    <div id="lightboxMedia"></div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-dots" id="lightboxDots"></div>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</div>

<!-- REVIEW FORM MODAL -->
<div class="rv-modal-overlay" id="reviewModal">
  <div class="rv-modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
      <div>
        <h3 style="font-size:1rem;margin-bottom:.2rem" id="reviewModalTitle">Write a Review</h3>
        <div style="font-size:.8rem;color:var(--muted);font-style:italic" id="reviewModalLounge"></div>
      </div>
      <button onclick="closeReviewModal()" style="background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:.3rem"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div style="font-family:var(--fh);font-size:.5rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:1.1rem">
      Category Ratings &nbsp;·&nbsp; all optional — skip any that don't apply
    </div>
    <div id="starCategories"></div>

    <div class="form-group" style="margin-top:1.2rem">
      <label class="form-label">Your Review <span style="color:var(--dim)">(optional)</span></label>
      <textarea id="rvText" class="form-control" rows="4" placeholder="Share your experience…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Visit Date <span style="color:var(--dim)">(optional)</span></label>
      <input type="month" id="rvDate" class="form-control" style="max-width:200px"/>
    </div>

    <div id="rvError" style="color:#e09090;font-size:.85rem;font-style:italic;margin-bottom:.8rem;display:none"></div>
    <div style="display:flex;gap:.8rem;justify-content:flex-end;margin-top:1.2rem">
      <button class="btn btn-ghost btn-sm" onclick="closeReviewModal()">Cancel</button>
      <button class="btn btn-gold btn-sm" id="rvSubmitBtn" onclick="submitReview()">
        <i class="fa-solid fa-paper-plane"></i> Submit Review
      </button>
    </div>
  </div>
</div>

<footer style="background:var(--s1);border-top:1px solid var(--border);padding:2rem;text-align:center">
  <div style="font-family:var(--fh);font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)">© 2026 Gold Label Club — <a href="/glc/lounges.html" style="color:var(--dim)">Back to Lounges</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/js/data.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/nav.js"></script>
<script>
renderPublicNav('lounges');

const params = new URLSearchParams(window.location.search);
const id = params.get('id') || 'l1';
const l = GLC.getLoungeById(id) || GLC.lounges[0];
document.title = `${l.name} — Gold Label Club`;

// ── LIGHTBOX ─────────────────────────────────────────────────────────
const mediaItems = [];
(l.photos||[l.img]).forEach((src,i) => mediaItems.push({ type:'image', src, label:`Photo ${i+1}` }));
if (l.video) mediaItems.push({ type:'video', src:l.video, label:'Club Visit Video' });
let lightboxIndex = 0;

function openLightbox(idx)  { lightboxIndex=idx; renderLightbox(); document.getElementById('lightbox').classList.add('open'); document.body.style.overflow='hidden'; }
function closeLightbox()    { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow=''; }
function lightboxBgClick(e) { if(e.target===e.currentTarget) closeLightbox(); }
function lightboxNav(dir)   { lightboxIndex=(lightboxIndex+dir+mediaItems.length)%mediaItems.length; renderLightbox(); }

function renderLightbox() {
  const item = mediaItems[lightboxIndex];
  const el = document.getElementById('lightboxMedia');
  el.innerHTML = item.type==='video'
    ? `<video controls autoplay class="lightbox-media" style="max-height:75vh"><source src="${item.src}" type="video/mp4"><source src="${item.src}" type="video/quicktime"></video>`
    : `<img src="${item.src}" class="lightbox-media" alt="${l.name}" style="max-height:75vh"/>`;
  document.getElementById('lightboxCaption').textContent = `${l.name} — ${item.label}`;
  document.getElementById('lightboxDots').innerHTML = mediaItems.map((_,i)=>
    `<div class="dot ${i===lightboxIndex?'active':''}" onclick="lightboxIndex=${i};renderLightbox()"></div>`
  ).join('');
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key==='ArrowLeft')  lightboxNav(-1);
  if (e.key==='ArrowRight') lightboxNav(1);
  if (e.key==='Escape')     closeLightbox();
});

// ── STATIC PAGE RENDER ───────────────────────────────────────────────
const ratingLabels = {
  humidor:'Humidor Quality', chairs:'Comfort & Seating', service:'Service',
  drinks:'Bar / Drinks', food:'Food', ventilation:'Ventilation', parking:'Parking',
};

function ratingRow(key, label) {
  const val = l.ratings[key];
  if (val===null||val===undefined)
    return `<div class="rating-bar-row"><div class="rating-bar-label">${label}</div><div style="flex:1;font-style:italic;font-size:.78rem;color:var(--dim)">Pending</div><div class="rating-bar-val" style="color:var(--dim)">—</div></div>`;
  if (val===0)
    return `<div class="rating-bar-row"><div class="rating-bar-label">${label}</div><div style="flex:1;font-style:italic;font-size:.78rem;color:var(--dim)">Not applicable</div><div class="rating-bar-val" style="color:var(--dim)">N/A</div></div>`;
  return `<div class="rating-bar-row"><div class="rating-bar-label">${label}</div><div class="rating-bar-track"><div class="rating-bar-fill" style="width:${val*10}%"></div></div><div class="rating-bar-val">${val}</div></div>`;
}

function buildGallery() {
  if (!mediaItems.length) return '';
  return `<div class="media-gallery">
    <div class="gallery-thumbs">
      ${mediaItems.map((item,i) => item.type==='video'
        ? `<div class="gallery-thumb video-thumb-wrap" onclick="openLightbox(${i})"><img src="${l.photos?.[0]||l.img}" alt="Video" style="opacity:.6"/><div class="play-icon"><i class="fa-solid fa-circle-play"></i></div></div>`
        : `<div class="gallery-thumb" onclick="openLightbox(${i})"><img src="${item.src}" alt="${l.name}"/></div>`
      ).join('')}
    </div>
    <div class="gallery-count"><i class="fa-solid fa-images" style="color:var(--gold-d)"></i> ${l.photos?.length||1} photo${(l.photos?.length||1)!==1?'s':''}${l.video?' &nbsp;·&nbsp; <i class="fa-solid fa-circle-play" style="color:var(--gold-d)"></i> 1 video':''} &nbsp;·&nbsp; Click to enlarge</div>
  </div>`;
}

document.getElementById('pageBody').innerHTML = `
  <a href="/glc/lounges.html" style="font-family:var(--fh);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.5rem"><i class="fa-solid fa-arrow-left"></i> All Lounges</a>

  <div class="lounge-header">
    <div style="display:flex;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap">
      ${l.isFeatured?'<span class="badge badge-gold">Featured</span>':''}
      ${l.reviewPending?'<span class="badge badge-gray"><i class="fa-solid fa-clock"></i> Review Pending</span>':''}
      <span class="badge badge-gray">${l.priceLevel}</span>
      <span class="badge badge-gray">${l.city}, ${l.state||l.country}</span>
    </div>
    <h1>${l.name}</h1>
    <div class="location"><i class="fa-solid fa-location-dot" style="color:var(--gold-d)"></i>${l.city}, ${l.state||l.country}</div>
    <div class="meta-row">
      ${l.phone?`<span class="meta-item"><i class="fa-solid fa-phone" style="color:var(--gold-d)"></i><a href="tel:${l.phone}" style="color:var(--muted)">${l.phone}</a></span>`:''}
      <span class="meta-item"><i class="fa-solid fa-map-pin" style="color:var(--gold-d)"></i>${l.address}</span>
      ${l.visitedDate?`<span class="meta-item"><i class="fa-solid fa-calendar-check" style="color:var(--gold-d)"></i>Visited: ${l.visitedDate}</span>`:''}
    </div>
  </div>

  ${buildGallery()}

  ${l.reviewPending?`<div class="pending-banner"><div style="font-family:var(--fh);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.3rem">Review Coming Soon</div><p style="font-size:.9rem;color:var(--muted);margin:0">Gold Label Club will be visiting this lounge shortly. Full ratings, review, and media will be published after our visit.</p></div>`:''}

  <div class="lounge-layout">
    <div>
      ${!l.reviewPending?`
      <div style="background:var(--s3);border:1px solid var(--gold-d);border-radius:var(--radius);padding:1.3rem;display:flex;align-items:center;gap:1.4rem;margin-bottom:1.5rem;flex-wrap:wrap">
        <div><div class="score-big">${l.ratings.overall}</div><div style="font-family:var(--fh);font-size:.5rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)">Editorial Score</div></div>
        <div>
          <div style="margin-bottom:.4rem">${GLC.renderStars(l.ratings.overall)}</div>
          <div style="font-size:.85rem;color:var(--muted)">Official Gold Label Club review</div>
          <div style="font-size:.78rem;color:var(--dim);margin-top:.2rem">Noise: ${l.noiseLevel}</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><h4>Category Ratings</h4><span style="font-size:.72rem;color:var(--dim);font-style:italic">Editorial</span></div>
        <div class="card-body">${Object.entries(ratingLabels).map(([k,lb])=>ratingRow(k,lb)).join('')}</div>
      </div>`:''}

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header">
          <h4>Gold Label Club Review</h4>
          ${!l.reviewPending?'<span style="font-size:.72rem;color:var(--muted);font-style:italic">Official editorial</span>':''}
        </div>
        <div class="card-body review-text">${l.reviewHtml?l.reviewHtml:`<p>${l.review}</p>`}</div>
      </div>

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><h4>Features & Amenities</h4></div>
        <div class="card-body">
          <div style="display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.2rem">
            <span class="feature-pill ${l.features.bar?'feature-yes':'feature-no'}"><i class="fa-solid fa-martini-glass-citrus"></i> Bar: ${l.features.bar?'Yes':'No'}</span>
            <span class="feature-pill ${l.features.outdoor?'feature-yes':'feature-no'}"><i class="fa-solid fa-sun"></i> Outdoor: ${l.features.outdoor?'Yes':'No'}</span>
            <span class="feature-pill ${l.features.privateLounge?'feature-yes':'feature-no'}"><i class="fa-solid fa-lock"></i> Private Room: ${l.features.privateLounge?'Yes':'No'}</span>
            <span class="feature-pill ${l.features.byo?'feature-yes':'feature-no'}"><i class="fa-solid fa-fire"></i> BYO Cigars: ${l.features.byo?'Yes':'No'}</span>
          </div>
          <div style="font-family:var(--fh);font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem">Best For</div>
          <div>${l.bestFor.map(b=>`<span class="best-chip">${b}</span>`).join('')}</div>
        </div>
      </div>

      <!-- MEMBER REVIEWS SECTION -->
      <div class="card" style="margin-bottom:1.5rem" id="memberReviewsCard">
        <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem">
          <div>
            <h4>Member Reviews</h4>
            <div id="communityMeta" style="font-size:.82rem;color:var(--muted);margin-top:.2rem">
              <i class="fa-solid fa-spinner fa-spin" style="font-size:.7rem"></i>
            </div>
          </div>
          <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
            <select id="reviewSort" class="form-control" style="font-size:.78rem;padding:.3rem .6rem;width:auto" onchange="sortAndRender()">
              <option value="newest">Newest First</option>
              <option value="helpful">Most Helpful</option>
              <option value="highest">Highest Rated</option>
              <option value="lowest">Lowest Rated</option>
            </select>
            <button id="writeReviewBtn" class="btn btn-gold btn-sm" style="display:none" onclick="openReviewModal()">
              <i class="fa-solid fa-pen-to-square"></i> Write a Review
            </button>
          </div>
        </div>
        <div class="card-body" id="reviewsList" style="padding-top:.4rem">
          <div style="text-align:center;padding:2rem;color:var(--dim)"><i class="fa-solid fa-spinner fa-spin"></i></div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div>
      <div class="card" style="margin-bottom:1rem">
        <div class="card-header"><h4>Contact & Links</h4></div>
        <div class="card-body" style="padding:.5rem 1.2rem">
          ${l.phone?`<div class="contact-row"><i class="fa-solid fa-phone" style="color:var(--gold-d);width:18px;font-size:.8rem"></i><a href="tel:${l.phone}" style="color:var(--ivory);font-size:.88rem">${l.phone}</a></div>`:''}
          ${l.website?`<div class="contact-row"><i class="fa-solid fa-globe" style="color:var(--gold-d);width:18px;font-size:.8rem"></i><a href="${l.website}" target="_blank" style="font-size:.88rem">Website</a></div>`:''}
          ${l.googleBusiness?`<div class="contact-row"><i class="fa-brands fa-google" style="color:var(--gold-d);width:18px;font-size:.8rem"></i><a href="${l.googleBusiness}" target="_blank" style="font-size:.88rem">Google Maps</a></div>`:''}
        </div>
      </div>

      ${!l.reviewPending?`
      <div class="card" style="margin-bottom:1rem">
        <div class="card-body">
          <div style="font-family:var(--fh);font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:.8rem">Top Scores</div>
          ${[['humidor','Humidor'],['chairs','Seating'],['service','Service'],['drinks','Bar'],['ventilation','Ventilation']].map(([k,lb])=>`
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
            <span style="font-size:.82rem;color:var(--muted)">${lb}</span>
            <span style="font-family:var(--fh);font-size:.7rem;color:var(--gold)">${l.ratings[k]??'—'}</span>
          </div>`).join('')}
        </div>
      </div>`:''}

      <!-- Community Rating Sidebar Card -->
      <div class="card" style="margin-bottom:1rem" id="communityCard" style="display:none">
        <div class="card-body" style="text-align:center">
          <div style="font-family:var(--fh);font-size:.5rem;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem">Community Rating</div>
          <div id="communityScoreBig" style="font-family:var(--fh);font-size:2.5rem;color:var(--gold);line-height:1">—</div>
          <div id="communityStarsSb" style="margin:.4rem 0"></div>
          <div id="communityCountSb" style="font-size:.78rem;color:var(--dim)"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <div class="card-body" style="text-align:center">
          <div style="font-family:var(--fh);font-size:1.8rem;color:var(--gold)">${l.priceLevel}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:.2rem">${l.priceLevel==='$$$$'?'Luxury':l.priceLevel==='$$$'?'Upscale':l.priceLevel==='$$'?'Mid-range':'Budget'}</div>
        </div>
      </div>

      <a href="/glc/map.html" class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:.6rem"><i class="fa-solid fa-earth-americas"></i> View on Map</a>
      <a href="/glc/lounges.html" class="btn btn-ghost" style="width:100%;justify-content:center"><i class="fa-solid fa-arrow-left"></i> All Lounges</a>
    </div>
  </div>`;

// ── MEMBER REVIEWS ENGINE ────────────────────────────────────────────
const REVIEW_CATS = [
  { id:'rating_humidor',    label:'Humidor Quality' },
  { id:'rating_chairs',     label:'Comfort & Seating' },
  { id:'rating_service',    label:'Service' },
  { id:'rating_drinks',     label:'Bar & Drinks' },
  { id:'rating_food',       label:'Food' },
  { id:'rating_ventilation',label:'Ventilation' },
  { id:'rating_parking',    label:'Parking' },
];

let _sb, _currentUser = null, _reviews = [], _userReview = null, _editingId = null;

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

(async function initReviews() {
  const { createClient } = supabase;
  _sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const { data: { session } } = await _sb.auth.getSession();
  if (session) {
    let bridge = {};
    try { bridge = JSON.parse(sessionStorage.getItem('glc_session') || '{}'); } catch(e) {}
    _currentUser = {
      id:     session.user.id,
      email:  session.user.email,
      name:   bridge.name   || session.user.email,
      avatar: bridge.avatar || null,
    };
    const btn = document.getElementById('writeReviewBtn');
    if (btn) btn.style.display = 'flex';
  }

  await loadReviews();
}());

async function loadReviews() {
  const { data, error } = await _sb
    .from('member_reviews')
    .select('*')
    .eq('lounge_id', l.id)
    .eq('status', 'published')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('reviewsList').innerHTML = '<p style="color:var(--dim);font-style:italic;text-align:center;padding:1.5rem">Unable to load reviews at this time.</p>';
    document.getElementById('communityMeta').textContent = '';
    return;
  }

  _reviews = data || [];
  _userReview = _currentUser ? _reviews.find(r => r.user_id === _currentUser.id) : null;

  // Update write button label
  if (_currentUser) {
    const btn = document.getElementById('writeReviewBtn');
    if (btn) btn.innerHTML = _userReview
      ? '<i class="fa-solid fa-pen"></i> Edit Your Review'
      : '<i class="fa-solid fa-pen-to-square"></i> Write a Review';
  }

  // Community average
  const overalls = _reviews.map(r => r.rating_overall).filter(v => v !== null);
  const metaEl = document.getElementById('communityMeta');
  if (overalls.length) {
    const avg = Math.round(overalls.reduce((a,b) => a+b, 0) / overalls.length * 10) / 10;
    metaEl.innerHTML = `${GLC.renderStars(avg)}&nbsp;<span style="color:var(--gold)">${avg}/10</span><span style="color:var(--dim)"> · ${overalls.length} review${overalls.length!==1?'s':''}</span>`;
    // Sidebar community card
    const card = document.getElementById('communityCard');
    if (card) {
      card.style.display = 'block';
      document.getElementById('communityScoreBig').textContent = avg;
      document.getElementById('communityStarsSb').innerHTML = GLC.renderStars(avg);
      document.getElementById('communityCountSb').textContent = `${overalls.length} member review${overalls.length!==1?'s':''}`;
    }
  } else {
    metaEl.textContent = _currentUser ? 'No reviews yet — be the first!' : 'No member reviews yet.';
  }

  sortAndRender();
}

function sortAndRender() {
  const sort = document.getElementById('reviewSort')?.value || 'newest';
  const sorted = [..._reviews];
  if (sort==='helpful') sorted.sort((a,b) => b.helpful_count - a.helpful_count);
  else if (sort==='highest') sorted.sort((a,b) => (b.rating_overall||0) - (a.rating_overall||0));
  else if (sort==='lowest')  sorted.sort((a,b) => (a.rating_overall||0) - (b.rating_overall||0));
  else sorted.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  renderReviews(sorted);
}

function renderReviews(list) {
  const el = document.getElementById('reviewsList');
  if (!list.length) {
    el.innerHTML = `<div style="text-align:center;padding:2.5rem;color:var(--dim)">
      <i class="fa-regular fa-comment-dots" style="font-size:2rem;margin-bottom:.8rem;display:block;color:var(--border)"></i>
      <div style="font-size:.9rem;margin-bottom:.5rem">No member reviews yet.</div>
      ${_currentUser
        ? '<div style="font-size:.82rem">Be the first to share your experience.</div>'
        : '<div style="font-size:.82rem"><a href="/portal/login.html" style="color:var(--gold-d)">Log in</a> to write a review.</div>'}
    </div>`;
    return;
  }
  el.innerHTML = list.map(r => renderReviewCard(r)).join('');
}

function renderReviewCard(r) {
  const name    = esc(r.reviewer_name || 'Anonymous Member');
  const avatar  = r.reviewer_avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(r.reviewer_name||'A')}&background=1a1714&color=c9a84c&bold=true&size=64`;
  const isOwn   = _currentUser && r.user_id === _currentUser.id;

  let dateLabel = new Date(r.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  if (r.visit_date) {
    const vd = new Date(r.visit_date + 'T12:00:00');
    dateLabel = 'Visited ' + vd.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  }

  const rated = REVIEW_CATS.filter(c => r[c.id] !== null && r[c.id] !== undefined);
  const catChips = rated.length ? `<div class="rv-cat-chips">${rated.map(c =>
    `<span class="rv-cat-chip">${c.label}: <strong>${r[c.id]}</strong></span>`
  ).join('<span style="color:var(--border);margin:0 .2rem">·</span>')}</div>` : '';

  return `<div class="rv-card" data-id="${r.id}">
    <div style="display:flex;align-items:flex-start;gap:.8rem;margin-bottom:.7rem">
      <img src="${avatar}" alt="${name}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border)"/>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
          <span style="font-weight:600;color:var(--cream);font-size:.9rem">${name}</span>
          ${isOwn ? '<span class="rv-own-badge">Your Review</span>' : ''}
          ${r.rating_overall ? `<span style="display:inline-flex;align-items:center;gap:.3rem">${GLC.renderStars(r.rating_overall)}</span>` : ''}
        </div>
        <div style="font-size:.76rem;color:var(--dim);margin-top:.1rem">${dateLabel}</div>
      </div>
      ${isOwn ? `<div style="display:flex;gap:.35rem;flex-shrink:0">
        <button onclick="editReview()" class="btn btn-ghost btn-sm" style="padding:.25rem .55rem;font-size:.7rem" title="Edit"><i class="fa-solid fa-pen"></i></button>
        <button onclick="deleteReview('${r.id}')" class="btn btn-ghost btn-sm" style="padding:.25rem .55rem;font-size:.7rem;color:#c08080" title="Delete"><i class="fa-solid fa-trash"></i></button>
      </div>` : ''}
    </div>
    ${r.review_text ? `<p style="font-size:.9rem;color:var(--ivory);line-height:1.8;margin-bottom:.5rem">${esc(r.review_text)}</p>` : ''}
    ${catChips}
  </div>`;
}

// ── REVIEW FORM ──────────────────────────────────────────────────────
function openReviewModal() {
  if (!_currentUser) { window.location.href = '/portal/login.html'; return; }
  _editingId = _userReview?.id || null;

  document.getElementById('reviewModalTitle').textContent = _editingId ? 'Edit Your Review' : 'Write a Review';
  document.getElementById('reviewModalLounge').textContent = l.name;
  document.getElementById('rvText').value   = _userReview?.review_text || '';
  document.getElementById('rvDate').value   = _userReview?.visit_date?.substring(0,7) || '';
  document.getElementById('rvError').style.display = 'none';

  document.getElementById('starCategories').innerHTML = REVIEW_CATS.map(cat => {
    const stored = _userReview?.[cat.id];
    const stars  = stored ? stored / 2 : 0;
    return `<div style="display:flex;align-items:center;gap:.8rem;margin-bottom:.85rem;flex-wrap:wrap">
      <div style="font-size:.85rem;color:var(--muted);width:148px;flex-shrink:0">${cat.label}</div>
      <div class="star-input" data-cat="${cat.id}" data-stars="${stars}">
        ${[1,2,3,4,5].map(i=>`<i class="rv-star ${stars>=i?'fa-solid':'fa-regular'} fa-star" data-n="${i}" style="color:${stars>=i?'var(--gold)':'var(--border)'}"></i>`).join('')}
        <span class="si-val">${stars>0?(stars*2)+'/10':'—'}</span>
        <button type="button" class="si-na" onclick="clearCat('${cat.id}')">N/A</button>
      </div>
    </div>`;
  }).join('');

  initStarWidgets();
  document.getElementById('reviewModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeReviewModal() {
  document.getElementById('reviewModal').classList.remove('open');
  document.body.style.overflow = '';
}

function initStarWidgets() {
  document.querySelectorAll('.star-input').forEach(widget => {
    const stars = widget.querySelectorAll('.rv-star');
    const valEl = widget.querySelector('.si-val');
    let sel = parseFloat(widget.dataset.stars) || 0;

    function paint(n) {
      stars.forEach((s,i) => {
        const on = i < n;
        s.className = `rv-star ${on?'fa-solid':'fa-regular'} fa-star`;
        s.style.color = on ? 'var(--gold)' : 'var(--border)';
      });
      valEl.textContent = n > 0 ? (n*2) + '/10' : '—';
    }
    paint(sel);

    stars.forEach((star, i) => {
      star.addEventListener('mouseenter', () => paint(i+1));
      star.addEventListener('mouseleave', () => paint(sel));
      star.addEventListener('click', () => {
        sel = sel === i+1 ? 0 : i+1;
        widget.dataset.stars = sel;
        paint(sel);
      });
    });
  });
}

function clearCat(catId) {
  const w = document.querySelector(`.star-input[data-cat="${catId}"]`);
  if (!w) return;
  w.dataset.stars = 0;
  w.querySelectorAll('.rv-star').forEach(s => { s.className='rv-star fa-regular fa-star'; s.style.color='var(--border)'; });
  w.querySelector('.si-val').textContent = '—';
}

async function submitReview() {
  const btn   = document.getElementById('rvSubmitBtn');
  const errEl = document.getElementById('rvError');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';
  errEl.style.display = 'none';

  const ratings = {};
  REVIEW_CATS.forEach(cat => {
    const w = document.querySelector(`.star-input[data-cat="${cat.id}"]`);
    const stars = parseFloat(w?.dataset.stars || '0');
    ratings[cat.id] = stars > 0 ? stars * 2 : null;
  });
  const vals = Object.values(ratings).filter(v => v !== null);
  const overall = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length * 10)/10 : null;

  const text    = document.getElementById('rvText').value.trim();
  const dateVal = document.getElementById('rvDate').value;

  if (!overall && !text) {
    errEl.textContent = 'Please add at least one rating or a written review.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Review';
    return;
  }

  const payload = {
    ...ratings,
    rating_overall:  overall,
    lounge_id:       l.id,
    user_id:         _currentUser.id,
    reviewer_name:   _currentUser.name,
    reviewer_avatar: _currentUser.avatar,
    review_text:     text || null,
    visit_date:      dateVal ? dateVal + '-01' : null,
    status:          'published',
    updated_at:      new Date().toISOString(),
  };

  let error;
  if (_editingId) {
    const res = await _sb.from('member_reviews').update(payload).eq('id', _editingId);
    error = res.error;
  } else {
    payload.created_at = new Date().toISOString();
    const res = await _sb.from('member_reviews').insert([payload]);
    error = res.error;
  }

  if (error) {
    errEl.textContent = 'Error: ' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Review';
    return;
  }

  closeReviewModal();
  btn.disabled = false;
  btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Review';
  await loadReviews();
}

async function deleteReview(rid) {
  if (!confirm('Delete your review? This cannot be undone.')) return;
  const { error } = await _sb.from('member_reviews').delete().eq('id', rid);
  if (error) { alert('Error: ' + error.message); return; }
  await loadReviews();
}

function editReview() { openReviewModal(); }
</script>
