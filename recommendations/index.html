<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recommendations — Mr. Ben Meister</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0d0d0d; --off-black: #1a1a1a; --dark-gray: #2a2a2a;
      --mid-gray: #555; --light-gray: #aaa; --off-white: #f0ebe3;
      --cream: #e8e0d0; --red: #b22222; --gold: #c8a96e;
      --c-food:      #e07430;
      --c-nightlife: #7c3aed;
      --c-activity:  #2a8de8;
      --c-shopping:  #27a05a;
      --c-landmark:  #c9a000;
      --c-stay:      #0891b2;
      --nav-h: 64px;
    }
    html { scroll-behavior: smooth; }
    html, body { overflow-x: hidden; }
    body { background: var(--black); color: var(--off-white); font-family: 'Lora', serif; font-size: 16px; line-height: 1.7; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 3rem;
      background: rgba(13,13,13,0.96); backdrop-filter: blur(6px);
      border-bottom: 1px solid #2a2a2a; height: var(--nav-h);
    }
    .nav-logo { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; color: var(--off-white); text-decoration: none; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { font-family: 'Oswald', sans-serif; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light-gray); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--off-white); }
    .nav-links .cigar-link { color: var(--gold); border: 1px solid var(--gold); padding: 0.4rem 1rem; }
    .nav-links .cigar-link:hover { background: var(--gold); color: var(--black); }
    .nav-hamburger { display: none; background: none; border: none; color: var(--off-white); font-size: 1.5rem; cursor: pointer; padding: 0.25rem 0.4rem; line-height: 1; }
    .nav-mobile { display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; background: rgba(13,13,13,0.99); border-bottom: 1px solid #2a2a2a; backdrop-filter: blur(8px); z-index: 299; flex-direction: column; }
    .nav-mobile.open { display: flex; }
    .nav-mobile-link { font-family: 'Oswald', sans-serif; font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light-gray); text-decoration: none; padding: 1rem 1.5rem; border-bottom: 1px solid #1a1a1a; transition: color 0.2s, background 0.2s; }
    .nav-mobile-link:last-child { border-bottom: none; }
    .nav-mobile-link:hover { color: var(--off-white); background: rgba(255,255,255,0.04); }
    .nav-mobile-link.gold { color: var(--gold); }

    /* ── MAP HERO ── */
    .map-hero { position: relative; height: 65vh; min-height: 420px; margin-top: var(--nav-h); }
    #recMap { width: 100%; height: 100%; }
    .map-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 10;
      background: linear-gradient(to bottom, rgba(13,13,13,0.5) 0%, transparent 40%, transparent 60%, rgba(13,13,13,0.88) 100%);
    }
    .map-hero-text { position: absolute; bottom: 2.5rem; left: 3rem; z-index: 20; pointer-events: none; }
    .map-hero-text .eyebrow { font-family: 'Special Elite', cursive; font-size: 0.8rem; color: var(--red); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .map-hero-text h1 { font-family: 'Oswald', sans-serif; font-size: clamp(2.2rem, 4.5vw, 3.8rem); font-weight: 700; text-transform: uppercase; color: var(--off-white); line-height: 1; }
    .map-hero-text p { font-style: italic; color: var(--light-gray); font-size: 0.95rem; margin-top: 0.5rem; }
    .map-hero-text .loc-breadcrumb { font-family: 'Oswald', sans-serif; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mid-gray); margin-bottom: 0.6rem; pointer-events: all; }
    .map-hero-text .loc-breadcrumb a { color: var(--mid-gray); text-decoration: none; transition: color 0.18s; }
    .map-hero-text .loc-breadcrumb a:hover { color: var(--off-white); }
    .map-hero-text .loc-breadcrumb .crumb-sep { margin: 0 0.4rem; color: #333; }
    .map-pin-count { position: absolute; top: 1rem; right: 1rem; z-index: 20; background: rgba(13,13,13,0.88); border: 1px solid #2a2a2a; padding: 0.45rem 0.8rem; font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light-gray); }
    .map-pin-count span { color: var(--off-white); font-weight: 600; }

    /* Map legend */
    .map-legend { position: absolute; bottom: 2.5rem; right: 1rem; z-index: 20; background: rgba(13,13,13,0.88); border: 1px solid #2a2a2a; padding: 0.7rem 0.9rem; }
    .map-legend-title { font-family: 'Oswald', sans-serif; font-size: 0.56rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mid-gray); margin-bottom: 0.5rem; }
    .legend-row { display: flex; align-items: center; gap: 0.45rem; font-family: 'Oswald', sans-serif; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--light-gray); margin-bottom: 0.28rem; cursor: pointer; transition: color 0.15s; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-row:hover { color: var(--off-white); }
    .legend-row.dimmed { opacity: 0.28; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* Leaflet popup */
    .leaflet-popup-content-wrapper { background: #1a1a1a; border: 1px solid #333; border-radius: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .leaflet-popup-tip { background: #1a1a1a; }
    .leaflet-popup-content { margin: 0; }
    .map-popup { padding: 0.9rem 1rem; min-width: 170px; }
    .map-popup-cat { font-family: 'Oswald', sans-serif; font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.25rem; }
    .map-popup-name { font-family: 'Oswald', sans-serif; font-size: 0.9rem; font-weight: 600; color: #f0ebe3; margin-bottom: 0.15rem; }
    .map-popup-loc { font-size: 0.72rem; color: #888; margin-bottom: 0.5rem; }
    .map-popup-link { font-family: 'Oswald', sans-serif; font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: #c8a96e; text-decoration: none; border-bottom: 1px solid rgba(200,169,110,0.3); }

    /* ── TOP BAR ── */
    .top-bar {
      position: sticky; top: var(--nav-h); z-index: 200;
      background: var(--off-black); border-bottom: 1px solid #222;
      padding: 0.75rem 2rem 0.65rem;
      display: flex; flex-direction: column; gap: 0.55rem;
    }
    .search-wrap {
      display: flex; align-items: center; gap: 0.6rem;
      background: rgba(255,255,255,0.04); border: 1px solid #333;
      padding: 0.5rem 0.85rem; transition: border-color 0.2s;
    }
    .search-wrap:focus-within { border-color: #555; }
    .search-icon { color: var(--mid-gray); font-size: 1rem; flex-shrink: 0; }
    .search-wrap input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--off-white); font-family: 'Lora', serif; font-size: 0.88rem;
    }
    .search-wrap input::placeholder { color: var(--mid-gray); }
    .search-clear { background: none; border: none; color: var(--mid-gray); cursor: pointer; font-size: 0.9rem; padding: 0 0.2rem; transition: color 0.2s; }
    .search-clear:hover { color: var(--off-white); }
    .cat-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .chip {
      font-family: 'Oswald', sans-serif; font-size: 0.65rem; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 0.28rem 0.7rem;
      background: transparent; border: 1px solid #333;
      color: var(--light-gray); cursor: pointer; transition: all 0.18s;
      display: inline-flex; align-items: center; gap: 0.38rem; white-space: nowrap;
    }
    .chip:hover { border-color: #666; color: var(--off-white); }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; opacity: 0.55; transition: opacity 0.18s; }
    .chip:hover .chip-dot, .chip.active .chip-dot { opacity: 1; }
    .chip-all.active  { border-color: var(--off-white); color: var(--off-white); }
    .chip-food.active      { border-color: var(--c-food);      color: var(--c-food); }
    .chip-nightlife.active { border-color: var(--c-nightlife); color: var(--c-nightlife); }
    .chip-activity.active  { border-color: var(--c-activity);  color: var(--c-activity); }
    .chip-shopping.active  { border-color: var(--c-shopping);  color: var(--c-shopping); }
    .chip-landmark.active  { border-color: var(--c-landmark);  color: var(--c-landmark); }
    .chip-stay.active      { border-color: var(--c-stay);      color: var(--c-stay); }

    /* ── PAGE WRAPPER ── */
    .page-wrapper { display: flex; align-items: flex-start; }

    /* ── LOCATION SIDEBAR ── */
    .loc-sidebar {
      width: 230px; flex-shrink: 0;
      position: sticky; top: 0;
      max-height: 100vh;
      overflow-y: auto; overflow-x: hidden;
      border-right: 1px solid #1e1e1e;
      padding-bottom: 3rem;
      scrollbar-width: thin; scrollbar-color: #333 transparent;
    }
    .loc-sidebar::-webkit-scrollbar { width: 3px; }
    .loc-sidebar::-webkit-scrollbar-thumb { background: #333; }
    .sidebar-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 1.2rem 0.8rem;
      font-family: 'Oswald', sans-serif; font-size: 0.7rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--light-gray);
      border-bottom: 1px solid #1e1e1e; margin-bottom: 0.5rem;
      position: sticky; top: 0; background: var(--black); z-index: 1;
    }
    .clear-loc-btn {
      font-family: 'Oswald', sans-serif; font-size: 0.58rem; letter-spacing: 0.15em;
      text-transform: uppercase; background: none; border: 1px solid #333;
      color: var(--mid-gray); cursor: pointer; padding: 0.2rem 0.5rem; text-decoration: none;
      transition: all 0.2s;
    }
    .clear-loc-btn:hover { border-color: var(--off-white); color: var(--off-white); }

    /* ── TREE ── */
    .tree-node {}

    /* Continent row — expand/collapse only, no navigation */
    .tree-cont-row {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.8rem; cursor: pointer;
      font-family: 'Oswald', sans-serif; font-size: 0.65rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--mid-gray);
      transition: color 0.15s, background 0.15s;
      user-select: none; background: none; border: none; width: 100%; text-align: left;
    }
    .tree-cont-row:hover { color: var(--light-gray); background: rgba(255,255,255,0.02); }

    /* Location row — navigates */
    .tree-loc-wrap {
      display: flex; align-items: center;
    }
    .tree-loc-link {
      flex: 1; display: flex; align-items: center; gap: 0.4rem;
      padding: 0.32rem 0.5rem 0.32rem 1.5rem;
      font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--light-gray);
      text-decoration: none; transition: color 0.15s, background 0.15s;
      position: relative;
    }
    .tree-loc-link:hover { color: var(--off-white); background: rgba(255,255,255,0.03); }
    .tree-loc-link.active { color: var(--off-white); background: rgba(255,255,255,0.05); }
    .tree-loc-link.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--red); }

    /* City row — navigates */
    .tree-city-link {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.26rem 0.5rem 0.26rem 2.5rem;
      font-family: 'Oswald', sans-serif; font-size: 0.63rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: #555;
      text-decoration: none; transition: color 0.15s, background 0.15s;
      position: relative;
    }
    .tree-city-link:hover { color: var(--light-gray); background: rgba(255,255,255,0.02); }
    .tree-city-link.active { color: var(--off-white); }
    .tree-city-link.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--red); }

    /* Expand toggle button next to location name */
    .tree-expand-btn {
      flex-shrink: 0; background: none; border: none; cursor: pointer;
      color: var(--mid-gray); font-size: 0.7rem; padding: 0.32rem 0.7rem 0.32rem 0.2rem;
      line-height: 1; transition: color 0.15s;
    }
    .tree-expand-btn:hover { color: var(--off-white); }

    .tree-arrow { font-size: 0.6rem; color: var(--mid-gray); flex-shrink: 0; width: 10px; transition: transform 0.18s; display: inline-block; }
    .tree-arrow.open { transform: rotate(90deg); }
    .tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-cnt { font-family: 'Oswald', sans-serif; font-size: 0.58rem; color: #444; padding: 0.05rem 0.35rem; flex-shrink: 0; }
    .tree-children.closed { display: none; }

    /* Mobile sidebar toggle */
    .sidebar-toggle { display: none; }

    /* ── RECS PANEL ── */
    .recs-panel { flex: 1; min-width: 0; padding: 1.8rem 2.2rem 3rem; }
    .panel-meta {
      display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
      margin-bottom: 1.5rem; min-height: 28px;
    }
    .results-count { font-family: 'Oswald', sans-serif; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid-gray); }

    /* Active filter pills */
    .filter-pill {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: 'Oswald', sans-serif; font-size: 0.62rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.22rem 0.5rem 0.22rem 0.65rem;
      border: 1px solid #444; color: var(--off-white);
    }
    .filter-pill button { background: none; border: none; color: var(--mid-gray); cursor: pointer; font-size: 0.75rem; padding: 0; line-height: 1; transition: color 0.15s; }
    .filter-pill button:hover { color: var(--off-white); }

    /* Location sections */
    .location-section { margin-bottom: 3.5rem; }
    .location-header { display: flex; align-items: baseline; gap: 0.8rem; border-bottom: 1px solid #2a2a2a; padding-bottom: 0.7rem; margin-bottom: 1.5rem; }
    .location-name { font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--off-white); }
    .location-name a { color: inherit; text-decoration: none; transition: color 0.18s; }
    .location-name a:hover { color: var(--gold); }
    .location-sub { font-family: 'Oswald', sans-serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mid-gray); }
    .location-count { margin-left: auto; font-family: 'Oswald', sans-serif; font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid-gray); }
    .state-section { margin-bottom: 2.2rem; }
    .state-label { font-family: 'Oswald', sans-serif; font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--red); margin-bottom: 0.9rem; }

    /* Cards */
    .recs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 1.1rem; }
    .rec-card { background: var(--off-black); border: 1px solid #2a2a2a; text-decoration: none; display: block; transition: border-color 0.22s; }
    .rec-card-img { width: 100%; height: 148px; object-fit: cover; display: block; background: var(--dark-gray); }
    .rec-card-img-placeholder { width: 100%; height: 148px; background: var(--dark-gray); display: flex; align-items: center; justify-content: center; font-size: 2rem; opacity: 0.28; }
    .rec-card-body { padding: 1rem 1.2rem 1.3rem; }
    .rec-card-cat { font-family: 'Oswald', sans-serif; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.35rem; }
    .rec-cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .rec-card-name { font-family: 'Oswald', sans-serif; font-size: 0.98rem; font-weight: 600; color: var(--off-white); margin-bottom: 0.22rem; line-height: 1.22; }
    .rec-card-loc { font-size: 0.73rem; color: var(--mid-gray); margin-bottom: 0.5rem; }
    .rec-card-summary { font-size: 0.8rem; color: #999; line-height: 1.5; margin-bottom: 0.65rem; }
    .rec-tags { display: flex; flex-wrap: wrap; gap: 0.28rem; }
    .rec-tag {
      font-family: 'Oswald', sans-serif; font-size: 0.56rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.18rem 0.48rem; border: 1px solid #2a2a2a;
      color: #666; cursor: pointer; transition: all 0.18s;
    }
    .rec-tag:hover { border-color: var(--light-gray); color: var(--light-gray); }
    .rec-tag.active-tag { border-color: var(--off-white); color: var(--off-white); }
    .rec-vibe { float: right; font-family: 'Oswald', sans-serif; font-size: 0.73rem; color: var(--gold); letter-spacing: 0.08em; }

    /* Empty */
    .empty-state { text-align: center; padding: 4rem; color: var(--mid-gray); font-style: italic; }

    /* Footer */
    footer { padding: 3rem; background: var(--black); border-top: 1px solid #1e1e1e; display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-family: 'Oswald', sans-serif; font-size: 0.9rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mid-gray); }
    .footer-copy { font-size: 0.78rem; color: #444; font-family: 'Oswald', sans-serif; letter-spacing: 0.1em; }

    @media (max-width: 900px) {
      nav { padding: 0.9rem 1.2rem; }
      .nav-links { display: none; }
      .nav-hamburger { display: block; }
      .top-bar { padding: 0.6rem 1.2rem 0.55rem; }
      .map-hero-text { left: 1.5rem; }
      .map-legend { display: none; }
      .page-wrapper { flex-direction: column; }
      .loc-sidebar { width: 100%; border-right: none; border-bottom: 1px solid #1e1e1e; position: relative; top: auto !important; max-height: none; overflow: visible; }
      .loc-sidebar.mobile-collapsed .tree-node,
      .loc-sidebar.mobile-collapsed #locTree { display: none; }
      .sidebar-toggle { display: block; font-family: 'Oswald', sans-serif; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; background: none; border: 1px solid #333; color: var(--light-gray); cursor: pointer; padding: 0.3rem 0.7rem; }
      .recs-panel { padding: 1.5rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">Mr. Ben Meister</a>
  <ul class="nav-links">
    <li><a href="/recommendations/" class="active">Recommendations</a></li>
    <li><a href="/index.html#videos">Videos</a></li>
    <li><a href="/index.html#ventures">Ventures</a></li>
    <li><a href="/index.html#connect">Connect</a></li>
    <li><a href="/glc/index.html" class="cigar-link">Cigar Club</a></li>
  </ul>
  <button class="nav-hamburger" id="navHamburger" aria-label="Menu">☰</button>
</nav>
<div class="nav-mobile" id="navMobile">
  <a href="/recommendations/" class="nav-mobile-link">Recommendations</a>
  <a href="/index.html#videos" class="nav-mobile-link">Videos</a>
  <a href="/index.html#ventures" class="nav-mobile-link">Ventures</a>
  <a href="/index.html#connect" class="nav-mobile-link">Connect</a>
  <a href="/glc/index.html" class="nav-mobile-link gold">Cigar Club</a>
</div>

<!-- MAP HERO -->
<div class="map-hero">
  <div id="recMap"></div>
  <div class="map-overlay"></div>
  <div class="map-hero-text" id="mapHeroText">
    <!-- populated by JS -->
  </div>
  <div class="map-pin-count"><span id="pinNum">0</span> pins showing</div>
  <div class="map-legend" id="mapLegend">
    <div class="map-legend-title">Pin Legend</div>
  </div>
</div>

<!-- TOP BAR: Search + Categories -->
<div class="top-bar" id="topBar">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search city, country, place, category, or tag…"/>
    <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none" title="Clear search">✕</button>
  </div>
  <div class="cat-chips" id="catChips">
    <button class="chip chip-all active" data-cat="all" onclick="setCat('all',this)">All</button>
    <button class="chip chip-food" data-cat="food" onclick="setCat('food',this)">
      <span class="chip-dot" style="background:var(--c-food)"></span>Food &amp; Drink
    </button>
    <button class="chip chip-nightlife" data-cat="nightlife" onclick="setCat('nightlife',this)">
      <span class="chip-dot" style="background:var(--c-nightlife)"></span>Nightlife
    </button>
    <button class="chip chip-activity" data-cat="activity" onclick="setCat('activity',this)">
      <span class="chip-dot" style="background:var(--c-activity)"></span>Activities
    </button>
    <button class="chip chip-shopping" data-cat="shopping" onclick="setCat('shopping',this)">
      <span class="chip-dot" style="background:var(--c-shopping)"></span>Shopping
    </button>
    <button class="chip chip-landmark" data-cat="landmark" onclick="setCat('landmark',this)">
      <span class="chip-dot" style="background:var(--c-landmark)"></span>Landmarks &amp; Culture
    </button>
    <button class="chip chip-stay" data-cat="stay" onclick="setCat('stay',this)">
      <span class="chip-dot" style="background:var(--c-stay)"></span>Stay
    </button>
  </div>
</div>

<!-- PAGE: Sidebar + Cards -->
<div class="page-wrapper">
  <aside class="loc-sidebar" id="locSidebar">
    <div class="sidebar-hd">
      <span>🌎 Browse Locations</span>
      <div style="display:flex;gap:.4rem;align-items:center">
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">▾ Browse</button>
        <a href="/recommendations/" class="clear-loc-btn" id="clearLocBtn" style="display:none">Clear ✕</a>
      </div>
    </div>
    <div id="locTree"></div>
  </aside>

  <div class="recs-panel">
    <div class="panel-meta">
      <span class="results-count" id="resultsCount"></span>
      <div id="filterPills"></div>
    </div>
    <div id="recsList"></div>
  </div>
</div>

<footer>
  <span class="footer-logo">Mr. Ben Meister</span>
  <span class="footer-copy">© 2026 — All Rights Reserved</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/recommendations-data.js"></script>
<script>
// ── SLUG HELPERS ──────────────────────────────────────────────────────────────
function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// ── ROUTING: read current path ────────────────────────────────────────────────
// Converts /recommendations/texas or /recommendations/texas/austin → pathSlug
const rawPath = location.pathname
  .replace(/\/recommendations\/?/, '')
  .replace(/\/index\.html$/, '')
  .replace(/\/$/, '');
// rawPath examples: '' | 'texas' | 'texas/austin' | 'germany' | 'germany/berlin'

// ── LOCATION REGISTRY: built from data ───────────────────────────────────────
// Slug → { type, value, country?, state?, continent }
// US states are top-level (slug = state slug, NOT united-states/state)
const LOC_REGISTRY = {};

BEN_RECS.filter(r => r && r.id).forEach(r => {
  const cont = CONTINENT_LOOKUP[r.country] || 'Other';
  if (r.country === 'United States') {
    if (r.state) {
      const sl = slug(r.state);
      if (!LOC_REGISTRY[sl]) LOC_REGISTRY[sl] = { type: 'state', value: r.state, country: 'United States', continent: cont };
      const csl = sl + '/' + slug(r.city);
      if (!LOC_REGISTRY[csl]) LOC_REGISTRY[csl] = { type: 'city', value: r.city, state: r.state, country: 'United States', continent: cont };
    }
  } else {
    const sl = slug(r.country);
    if (!LOC_REGISTRY[sl]) LOC_REGISTRY[sl] = { type: 'country', value: r.country, continent: cont };
    const csl = sl + '/' + slug(r.city);
    if (!LOC_REGISTRY[csl]) LOC_REGISTRY[csl] = { type: 'city', value: r.city, country: r.country, continent: cont };
  }
});

// Resolve current path to a location object (null = world view)
const resolved = rawPath ? (LOC_REGISTRY[rawPath] || null) : null;

// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const CAT_COLORS = {
  food: '#e07430', nightlife: '#7c3aed', activity: '#2a8de8',
  shopping: '#27a05a', landmark: '#c9a000', stay: '#0891b2'
};
const CAT_META = {};
REC_CATEGORIES.forEach(c => CAT_META[c.id] = c);
const data = BEN_RECS.filter(r => r && r.id);

// ── URL HELPERS ───────────────────────────────────────────────────────────────
function locUrl(r) {
  // Base URL for a record's state/country
  if (r.country === 'United States' && r.state) return `/recommendations/${slug(r.state)}`;
  return `/recommendations/${slug(r.country)}`;
}
function cityUrl(r) {
  if (r.country === 'United States' && r.state) return `/recommendations/${slug(r.state)}/${slug(r.city)}`;
  return `/recommendations/${slug(r.country)}/${slug(r.city)}`;
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let activeCat   = 'all';
let locType     = resolved ? resolved.type : null;
let locValue    = resolved ? resolved.value : null;
let activeTag   = null;
let searchQuery = '';

// Track which tree nodes are expanded
const expanded = new Set();
// Auto-expand the continent(s) relevant to current route
if (resolved) {
  expanded.add('c:' + resolved.continent);
  if (resolved.type === 'city') {
    const parentKey = resolved.state ? 'l:' + slug(resolved.state) : 'l:' + slug(resolved.country);
    expanded.add(parentKey);
  }
} else {
  // World view: expand all continents that have data
  data.forEach(r => expanded.add('c:' + (CONTINENT_LOOKUP[r.country] || 'Other')));
}

// ── MAP ───────────────────────────────────────────────────────────────────────
const map = L.map('recMap', { zoomControl: false, attributionControl: false }).setView([25, 10], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

function pinSvg(color) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30">
    <path d="M11 0C4.9 0 0 4.9 0 11c0 7.7 11 19 11 19s11-11.3 11-19C22 4.9 17.1 0 11 0z" fill="${color}" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="11" cy="11" r="4" fill="rgba(0,0,0,0.3)"/>
  </svg>`;
}

const markerMap = {};
data.forEach(rec => {
  const color = CAT_COLORS[rec.category] || '#aaa';
  const icon = L.divIcon({ className: '', html: pinSvg(color), iconSize: [22,30], iconAnchor: [11,30], popupAnchor: [0,-32] });
  const locStr = rec.state ? `${rec.city}, ${rec.state}` : `${rec.city}, ${rec.country}`;
  const m = L.marker([rec.lat, rec.lng], { icon }).addTo(map);
  m.bindPopup(`<div class="map-popup">
    <div class="map-popup-cat" style="color:${color}">${CAT_META[rec.category]?.label || rec.category}</div>
    <div class="map-popup-name">${rec.name}</div>
    <div class="map-popup-loc">${locStr}</div>
    <a href="/recommendations/detail.html?id=${rec.id}" class="map-popup-link">View &rarr;</a>
  </div>`, { maxWidth: 220 });
  markerMap[rec.id] = { marker: m, rec };
});

// Map legend
const legendEl = document.getElementById('mapLegend');
REC_CATEGORIES.forEach(cat => {
  const row = document.createElement('div');
  row.className = 'legend-row'; row.dataset.cat = cat.id;
  row.innerHTML = `<span class="legend-dot" style="background:${CAT_COLORS[cat.id]}"></span>${cat.label}`;
  row.addEventListener('click', () => {
    const chip = document.querySelector(`#catChips [data-cat="${cat.id}"]`);
    if (chip) setCat(cat.id, chip);
  });
  legendEl.appendChild(row);
});

function updateMarkers() {
  let count = 0;
  const visibleLatLngs = [];
  Object.values(markerMap).forEach(({ marker, rec }) => {
    if (matchesFilters(rec)) {
      if (!map.hasLayer(marker)) map.addLayer(marker);
      count++;
      visibleLatLngs.push(marker.getLatLng());
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
  document.getElementById('pinNum').textContent = count;
  document.querySelectorAll('.legend-row').forEach(row => {
    const has = Object.values(markerMap).some(({ rec }) => rec.category === row.dataset.cat && matchesFilters(rec));
    row.classList.toggle('dimmed', !has);
  });
  // Zoom map to fit visible pins when on a location route
  if (resolved && visibleLatLngs.length) {
    if (visibleLatLngs.length === 1) {
      map.setView(visibleLatLngs[0], resolved.type === 'city' ? 13 : 9, { animate: false });
    } else {
      map.fitBounds(L.latLngBounds(visibleLatLngs).pad(0.35), { animate: false });
    }
  }
}

// ── FILTER LOGIC ──────────────────────────────────────────────────────────────
function matchesLocation(rec) {
  if (!locType || !locValue) return true;
  if (locType === 'state')   return rec.state === locValue;
  if (locType === 'country') return rec.country === locValue;
  if (locType === 'city')    return rec.city === locValue;
  return true;
}

function matchesFilters(rec) {
  if (activeCat !== 'all' && rec.category !== activeCat) return false;
  if (!matchesLocation(rec)) return false;
  if (activeTag && !rec.tags.includes(activeTag)) return false;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const cont  = (CONTINENT_LOOKUP[rec.country] || '').toLowerCase();
    const catLbl = (CAT_META[rec.category]?.label || '').toLowerCase();
    const tags  = rec.tags.join(' ').toLowerCase();
    if (![rec.name, rec.country, rec.state || '', rec.city, cont, catLbl, tags].some(f => f.toLowerCase().includes(q))) return false;
  }
  return true;
}

// For tree counts: ignore location filter so sidebar counts reflect cat+tag+search only
function matchesNonLocation(rec) {
  if (activeCat !== 'all' && rec.category !== activeCat) return false;
  if (activeTag && !rec.tags.includes(activeTag)) return false;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const cont  = (CONTINENT_LOOKUP[rec.country] || '').toLowerCase();
    const catLbl = (CAT_META[rec.category]?.label || '').toLowerCase();
    const tags  = rec.tags.join(' ').toLowerCase();
    if (![rec.name, rec.country, rec.state || '', rec.city, cont, catLbl, tags].some(f => f.toLowerCase().includes(q))) return false;
  }
  return true;
}

// ── LOCATION TREE ─────────────────────────────────────────────────────────────
// Structure: Continent → (Country | US State) → City
// US states appear AT the country level, never nested under "United States"
function renderTree() {
  const pool = data.filter(matchesNonLocation);

  // Build: continent → { total, locs: { locKey → { name, slug, type, total, cities } } }
  const tree = {};
  pool.forEach(r => {
    const cont = CONTINENT_LOOKUP[r.country] || 'Other';
    if (!tree[cont]) tree[cont] = { total: 0, locs: {} };
    tree[cont].total++;

    // US states are top-level locations; all others use country
    let locKey, locName, locSlug, locType;
    if (r.country === 'United States' && r.state) {
      locKey = 'st:' + r.state; locName = r.state; locSlug = slug(r.state); locType = 'state';
    } else {
      locKey = 'co:' + r.country; locName = r.country; locSlug = slug(r.country); locType = 'country';
    }

    if (!tree[cont].locs[locKey]) {
      tree[cont].locs[locKey] = { name: locName, slug: locSlug, type: locType, total: 0, cities: {} };
    }
    tree[cont].locs[locKey].total++;
    const cityName = r.city;
    const cSlug = locSlug + '/' + slug(cityName);
    if (!tree[cont].locs[locKey].cities[cityName]) {
      tree[cont].locs[locKey].cities[cityName] = { count: 0, slug: cSlug };
    }
    tree[cont].locs[locKey].cities[cityName].count++;
  });

  let html = '';
  if (!Object.keys(tree).length) {
    html = '<div style="padding:1rem 1.2rem;font-size:.75rem;color:var(--mid-gray);font-style:italic">No locations match.</div>';
  }

  Object.keys(tree).sort().forEach(cont => {
    const contExp = expanded.has(`c:${cont}`);

    let locsHtml = '';
    Object.keys(tree[cont].locs).sort((a, b) => tree[cont].locs[a].name.localeCompare(tree[cont].locs[b].name)).forEach(locKey => {
      const locD = tree[cont].locs[locKey];
      const expandKey = `l:${locD.slug}`;
      const locExp = expanded.has(expandKey);
      const isActive = locType === locD.type && locValue === locD.name;
      const hasCities = Object.keys(locD.cities).length > 0;

      let citiesHtml = '';
      Object.keys(locD.cities).sort().forEach(city => {
        const cD = locD.cities[city];
        const cActive = locType === 'city' && locValue === city;
        citiesHtml += `<a href="/recommendations/${cD.slug}" class="tree-city-link${cActive ? ' active' : ''}">
          <span class="tree-name">${city}</span>
          <span class="tree-cnt">${cD.count}</span>
        </a>`;
      });

      locsHtml += `<div class="tree-node">
        <div class="tree-loc-wrap">
          <a href="/recommendations/${locD.slug}" class="tree-loc-link${isActive ? ' active' : ''}">
            <span class="tree-name">${locD.name}</span>
            <span class="tree-cnt">${locD.total}</span>
          </a>
          ${hasCities ? `<button class="tree-expand-btn" data-key="${expandKey}">${locExp ? '−' : '+'}</button>` : ''}
        </div>
        <div class="tree-children${locExp ? '' : ' closed'}">${citiesHtml}</div>
      </div>`;
    });

    html += `<div class="tree-node">
      <button class="tree-cont-row" data-key="c:${cont}">
        <span class="tree-arrow${contExp ? ' open' : ''}">›</span>
        <span class="tree-name">${cont}</span>
        <span class="tree-cnt">${tree[cont].total}</span>
      </button>
      <div class="tree-children${contExp ? '' : ' closed'}">${locsHtml}</div>
    </div>`;
  });

  const treeEl = document.getElementById('locTree');
  treeEl.innerHTML = html;

  // Toggle expand/collapse (continents + location city expand buttons)
  treeEl.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const key = el.dataset.key;
      if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
      renderTree();
    });
  });

  // Show/hide clear location button
  document.getElementById('clearLocBtn').style.display = resolved ? '' : 'none';
}

// ── MAP HERO TEXT ─────────────────────────────────────────────────────────────
function renderMapHero() {
  const el = document.getElementById('mapHeroText');
  if (!resolved) {
    el.innerHTML = `
      <p class="eyebrow">Personally Vetted</p>
      <h1>Recommendations</h1>
      <p>Places worth going. Things worth doing.</p>`;
    return;
  }

  const locFiltered = data.filter(matchesLocation);
  const total = locFiltered.length;
  const cityCount = new Set(locFiltered.map(r => r.city)).size;

  // Build breadcrumb
  let crumbs = `<a href="/recommendations/">Browse</a><span class="crumb-sep">›</span>${resolved.continent}`;
  if (resolved.type === 'city') {
    const parentSlug = resolved.state ? slug(resolved.state) : slug(resolved.country);
    const parentName = resolved.state || resolved.country;
    crumbs += `<span class="crumb-sep">›</span><a href="/recommendations/${parentSlug}">${parentName}</a>`;
  }
  crumbs += `<span class="crumb-sep">›</span>${resolved.value}`;

  const stats = resolved.type === 'city'
    ? `${total} recommendation${total !== 1 ? 's' : ''}`
    : `${total} recommendation${total !== 1 ? 's' : ''} · ${cityCount} cit${cityCount !== 1 ? 'ies' : 'y'}`;

  el.innerHTML = `
    <div class="loc-breadcrumb">${crumbs}</div>
    <h1>${resolved.value}</h1>
    <p>${stats}</p>`;
}

// ── CARDS ─────────────────────────────────────────────────────────────────────
function recCard(r) {
  const locStr = r.state ? `${r.city}, ${r.state}` : `${r.city}, ${r.country}`;
  const cat = CAT_META[r.category] || { label: r.category, icon: '📍' };
  const color = CAT_COLORS[r.category] || '#aaa';
  const img = r.img
    ? `<img class="rec-card-img" src="${r.img}" alt="${r.name}"/>`
    : `<div class="rec-card-img-placeholder" style="border-top:3px solid ${color}">${cat.icon}</div>`;
  const tagHtml = r.tags.map(t =>
    `<span class="rec-tag${activeTag === t ? ' active-tag' : ''}" data-tag="${t}">${t}</span>`
  ).join('');

  return `<a href="/recommendations/detail.html?id=${r.id}" class="rec-card"
    onmouseenter="this.style.borderColor='${color}'" onmouseleave="this.style.borderColor=''">
    ${img}
    <div class="rec-card-body">
      <div class="rec-card-cat" style="color:${color}">
        <span class="rec-cat-dot" style="background:${color}"></span>${cat.label}
        <span class="rec-vibe">${r.vibe}</span>
      </div>
      <div class="rec-card-name">${r.name}</div>
      <div class="rec-card-loc">📍 ${locStr}</div>
      <div class="rec-card-summary">${r.summary}</div>
      <div class="rec-tags">${tagHtml}</div>
    </div>
  </a>`;
}

function renderCards() {
  const filtered = data.filter(matchesFilters);
  const el = document.getElementById('recsList');
  document.getElementById('resultsCount').textContent = `${filtered.length} place${filtered.length !== 1 ? 's' : ''}`;

  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state">No recommendations match. Try clearing a filter.</div>';
    return;
  }

  let html = '';

  if (!locType) {
    // World view: group by state (US) or country, with location links
    const grouped = {};
    filtered.forEach(r => {
      const key = (r.country === 'United States' && r.state) ? r.state : r.country;
      (grouped[key] = grouped[key] || { recs: [], url: locUrl(r) }).recs.push(r);
    });
    const sortedKeys = Object.keys(grouped).sort((a, b) => a.localeCompare(b));
    sortedKeys.forEach(key => {
      const g = grouped[key];
      html += `<div class="location-section">
        <div class="location-header">
          <span class="location-name"><a href="${g.url}">${key}</a></span>
          <span class="location-count">${g.recs.length} place${g.recs.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="recs-grid">${g.recs.map(recCard).join('')}</div>
      </div>`;
    });

  } else if (locType === 'state' || locType === 'country') {
    // Location page: group by city with city links
    const grouped = {};
    filtered.forEach(r => {
      (grouped[r.city] = grouped[r.city] || { recs: [], url: cityUrl(r) }).recs.push(r);
    });
    const cityKeys = Object.keys(grouped).sort();
    if (cityKeys.length > 1) {
      cityKeys.forEach(city => {
        const g = grouped[city];
        html += `<div class="location-section">
          <div class="location-header">
            <span class="location-name"><a href="${g.url}">${city}</a></span>
            <span class="location-count">${g.recs.length} place${g.recs.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="recs-grid">${g.recs.map(recCard).join('')}</div>
        </div>`;
      });
    } else {
      html += `<div class="recs-grid">${filtered.map(recCard).join('')}</div>`;
    }

  } else {
    // City page: flat grid
    html += `<div class="recs-grid">${filtered.map(recCard).join('')}</div>`;
  }

  el.innerHTML = html;

  // Tag click events
  el.querySelectorAll('.rec-tag').forEach(tag => {
    tag.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const t = tag.dataset.tag;
      activeTag = activeTag === t ? null : t;
      applyFilters();
    });
  });
}

// ── FILTER PILLS ──────────────────────────────────────────────────────────────
function renderPills() {
  const pills = [];
  if (activeTag) {
    pills.push(`<span class="filter-pill">Tag: <strong>${activeTag}</strong><button onclick="clearTag()" title="Remove">✕</button></span>`);
  }
  document.getElementById('filterPills').innerHTML = pills.join('');
}

// ── APPLY ALL ─────────────────────────────────────────────────────────────────
function applyFilters() {
  updateMarkers();
  renderMapHero();
  renderTree();
  renderCards();
  renderPills();
  document.getElementById('searchClear').style.display = searchQuery.length ? '' : 'none';
}

// ── SETTERS ───────────────────────────────────────────────────────────────────
function setCat(cat, el) {
  activeCat = cat;
  document.querySelectorAll('#catChips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}
function clearTag() { activeTag = null; applyFilters(); }
function clearSearch() { searchQuery = ''; document.getElementById('searchInput').value = ''; applyFilters(); }
function toggleSidebar() { document.getElementById('locSidebar').classList.toggle('mobile-collapsed'); }

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  applyFilters();
});

// ── STICKY OFFSETS ────────────────────────────────────────────────────────────
function updateSticky() {
  const navH = 64;
  const topBarH = document.getElementById('topBar').offsetHeight;
  const total = navH + topBarH;
  const sidebar = document.getElementById('locSidebar');
  sidebar.style.top = total + 'px';
  sidebar.style.maxHeight = `calc(100vh - ${total}px)`;
}

// ── URL PARAMS (for ?tag= cross-page links) ───────────────────────────────────
const _params = new URLSearchParams(location.search);
const _tag = _params.get('tag');
if (_tag) activeTag = decodeURIComponent(_tag);

// ── INIT ──────────────────────────────────────────────────────────────────────
updateSticky();
window.addEventListener('resize', updateSticky);
applyFilters();

// Hamburger
const burger = document.getElementById('navHamburger');
const mobileNav = document.getElementById('navMobile');
burger?.addEventListener('click', () => mobileNav?.classList.toggle('open'));
document.addEventListener('click', e => {
  if (!e.target.closest('nav') && !e.target.closest('.nav-mobile')) mobileNav?.classList.remove('open');
});
</script>
</body>
